# ====================================================================
# Databricks Apps runtime configuration (car-agent)
#
# ⚠️ 重要: App の env とコマンドは resources/app.yml の `config:` で
# 一元管理しています。Databricks Asset Bundle 経由でデプロイすると
# この app.yaml は DAB の config: に上書きされます。
#
# この app.yaml は手動で app を deploy する際のフォールバックとして残す
# 最小構成のみです。通常は触る必要ありません。
# 設定を変更したい場合は **databricks.yml の variables:** を編集してください。
# ====================================================================

command: ["uvicorn", "car_agent.backend.app:app", "--workers", "2"]

env:
  - name: 'PYTHONPATH'
    value: 'src'
  - name: 'DEBUG'
    value: 'false'
