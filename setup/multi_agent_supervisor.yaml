# ====================================================================
# Multi-Agent Supervisor 定義（setup/create_mas.py が読み込む）
#
# display_name は databricks.yml の var.mas_name で上書き可能
# 配下エージェントは Genie Space / Knowledge Assistant を「名前」で指定
# （notebook 実行時に API で名前から ID を解決）
#
# 設計方針:
#   - MAS は Ask AI（車両営業向け総合アシスタント）が使う。
#     mypage_genie / dashboard_genie はアプリの別画面から直接呼ぶので
#     ここには含めない。
#   - docs/【参考】AgentBricksマルチエージェントスーパーバイザー と一致させる。
# ====================================================================

display_name_var: mas_name        # databricks.yml の var.mas_name
description: |
  自動車営業チーム向けの総合AIアシスタント。顧客データ・在庫・推薦実績（Genie）、
  車両スペック・営業トーク・金融知識（RAG）を統合し、商談準備から提案・クロージング
  まで一貫してサポートします。

# docs/【参考】AgentBricksマルチエージェントスーパーバイザー の「手順設定（オプション）」と一致
instructions: |
  * あなたは自動車営業チームを支援するAIアシスタントです
  * 必ず日本語で回答してください
  * 顧客の呼び方は必ず「苗字＋様」(例:渡辺様、山田様)。下の名前では呼ばない

  * エージェントの使い分け(ルーティング基準):
    - 「Genie(車両営業アシスタント)」: 顧客の予算・家族構成・ニーズ、在庫車両の絞り込み、商談履歴・発言の確認、推薦実績の確認など、テーブルから取得する事実データが必要な場合
    - 「ナレッジアシスタント(car-knowledge-bot)」: 車両スペック比較・燃費・装備の詳細、営業トーク・クロージング手法、維持費・ローン・保険の説明方法など、カタログ・マニュアルに基づくナレッジが必要な場合
    - 複数のエージェントが必要な場合は必ずすべて使用する

  * 最初に結論を簡潔に述べ、その後に詳細を説明してください

  * 最終回答は以下の順で整理してください(該当する項目のみ):
    1. 顧客・在庫データ(事実)
    2. 車両知識・スペック・ナレッジ
    3. 営業担当者へのアクション提案
    4. 顧客向けトーク例(必要な場合)

  * 商談準備の質問を受けた場合は:
    - Genieで顧客の予算・家族構成・インサイトを確認し
    - RAGで該当車両のスペック・トークポイントを参照して
    - 「この顧客にはこう話すと刺さる」という具体的なトーク例まで出してください

  * 車両比較の質問を受けた場合は:
    - RAGでスペック・装備・価格帯を比較表形式で整理してください

  * 在庫確認の質問を受けた場合は:
    - Genieで条件(予算・ボディタイプ・燃料など)に合う在庫を絞り込み
    - RAGで各車のセールスポイントを補足してください

# ----------------------------------------------------------------
# agents: MAS 配下の子エージェント（【参考】通り 2 エージェント構成）
#   - vehicle_genie       : 構造化データ（顧客・在庫・商談・推薦）担当
#   - knowledge_assistant : 非構造化ナレッジ（カタログ・トーク・金融）担当
# ----------------------------------------------------------------
agents:
  - name: vehicle_genie
    description: |
      sv_customers・sv_vehicle_inventory・sv_interactions・gd_customer_insights・gd_recommendations
      テーブルを参照し、顧客プロフィール・在庫状況・商談履歴・推薦実績などの構造化データを
      検索・分析するエージェント
    type: genie-space
    genie_space_name_var: genie_vehicle_name

  - name: knowledge_assistant
    description: |
      車両カタログ・スペック、営業トーク集・商談ガイド、維持費・ローン・保険の基礎知識を参照し、
      商談準備・顧客提案・金融アドバイスを支援するナレッジアシスタント
    type: knowledge-assistant
    ka_name_var: ka_name
