# ====================================================================
# Knowledge Assistant 定義（setup/create_ka.py が読み込む）
#
# ${catalog}, ${schema} はセットアップ実行時に置換される
# display_name は databricks.yml の var.ka_name で上書き可能
# ====================================================================

display_name_var: ka_name         # databricks.yml の var.ka_name を使用
description: |
  車両カタログ・スペック、営業トーク集・商談ガイド、維持費・ローン・保険の基礎知識を参照し、営業担当者の商談準備・顧客提案・金融アドバイスを支援するナレッジアシスタント

# docs/【参考】AgentBricksナレッジアシスタント の「手順設定（オプション）」と一致させる
instructions: |
  * あなたは自動車営業ナレッジアシスタントです
  * 車両カタログ・営業トーク集・維持費/ローン知識のみを根拠に回答してください
  * 顧客の在庫状況・個別データはGenieエージェントが担当します。このアシスタントは知識・ナレッジに特化してください
  * 資料に明記されていない場合は「資料上は確認できません」と回答してください
  * 必ず日本語で回答してください
  * 最初に結論を簡潔に述べ、以下の構造で整理してください：
    【ポイント】
    【詳細・根拠】
    【注意点・例外】
    【接客トーク例（必要な場合のみ）】
  * 車両比較の際は表形式で整理してください
  * 金額は万円単位で表記してください

# Knowledge Sources:
#   3 つのサブフォルダを個別ソースとして登録すると、Retriever が
#   ソース説明文を使って質問タイプに合った source を優先検索するため、
#   親フォルダを 1 つだけ登録するより回答品質が大幅に上がる。
sources:
  - display_name: catalogs
    description: 取扱い車両のスペック・グレード・標準装備・燃費・特徴をまとめた車両カタログ資料。各メーカー・モデルの強み・弱み・競合比較に活用。
    source_type: files
    path: /Volumes/${catalog}/${schema}/knowledge/catalogs

  - display_name: sales
    description: 営業トーク集・商談ガイド。顧客タイプ別アプローチ、試乗誘導・クロージングトーク、NGワード集など、商談品質向上のための実践資料。
    source_type: files
    path: /Volumes/${catalog}/${schema}/knowledge/sales

  - display_name: finance
    description: 自動車維持費・ローン・残クレ・リース・保険の基礎知識。顧客への金融オプション説明、ハイブリッドvsガソリンのコスト比較など。
    source_type: files
    path: /Volumes/${catalog}/${schema}/knowledge/finance
