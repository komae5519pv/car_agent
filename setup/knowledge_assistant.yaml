# ====================================================================
# Knowledge Assistant 定義（setup/create_ka.py が読み込む）
#
# ${catalog}, ${schema} はセットアップ実行時に置換される
# display_name は databricks.yml の var.ka_name で上書き可能
# ====================================================================

display_name_var: ka_name         # databricks.yml の var.ka_name を使用
description: |
  中古車販売の社内ナレッジを参照する RAG エージェント。
  車両カタログ・営業トーク集・金融知識を Volume からインデックス化して質問に回答。

instructions: |
  あなたは中古車販売の営業支援アシスタントです。社内のナレッジドキュメント
  （車両カタログ・営業トーク・金融知識）を参照し、営業担当者の質問に対して
  日本語で正確に回答してください。

  主な対応範囲:
  - 取扱車両のスペック・装備・燃費
  - 顧客タイプ別の提案トーク
  - ローン・残クレ・リースの違い、維持費の説明

  回答のルール:
  - 日本円（万円単位）で金額表示
  - 出典となった文書名を明記
  - ナレッジに無い内容は「該当する情報が見つかりません」と回答

# Knowledge Sources:
#   Volume 配下のテキスト/PDF ファイルをインデックス化
#   親フォルダを 1 つ指定すれば、サブフォルダも再帰的に取り込む
sources:
  - display_name: 中古車販売ナレッジ
    description: 車両カタログ・営業トーク・金融知識 (Volume 配下を再帰スキャン)
    source_type: files
    path: /Volumes/${catalog}/${schema}/knowledge
